<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Questão 4 - Contador</title>
</head>
<body>
    
    <p id="contador" style="font-size: 32px; font-weight: bold;">0</p>

    <button id="btnIncrementar">Incrementar</button>
    <button id="btnZerar">Zerar</button>

    <script>
     
        const pContador = document.getElementById('contador');
        const btnIncrementar = document.getElementById('btnIncrementar');
        const btnZerar = document.getElementById('btnZerar');

        let valor = 0;

        btnIncrementar.addEventListener('click', () => {
            valor++; 
            pContador.textContent = valor; 
        });
       
        btnZerar.addEventListener('click', () => {
            valor = 0; 
            pContador.textContent = valor; 
        });
    </script>
</body>
</html>
