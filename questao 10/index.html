<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Automática - Neymar Jr</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f4;
        }

        .galeria-container {
            text-align: center;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        img {
            max-width: 100%;
            width: 600px;
            height: 400px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="galeria-container">
        <!-- Imagem inicial -->
        <img id="imagemExibida" src="https://i.ytimg.com/vi/5nYBdYaarpw/maxresdefault.jpg" alt="Neymar Jr">
        
        <div class="botoes">
            <button onclick="imagemAnterior()">Anterior</button>
            <button onclick="proximaImagemManual()">Próxima</button>
        </div>
    </div>

    <script>
        
        const imagens = [
            "https://i.ytimg.com/vi/5nYBdYaarpw/maxresdefault.jpg", 
            "https://assets.goal.com/images/v3/bltc3dc0adc94a5c447/b959d70fff93eeb31caa4aa0188da8e22e3e2af9.jpg?auto=webp&format=pjpg&width=3840&quality=60", 
            "https://images.ctfassets.net/3mv54pzvptwz/61WEpZgnOcGsPTnTYZPEtw/c2efd601eb4150ecc7435240a7f8d3b2/0.55229600-1565795578.jpg", 
            "https://images.ctfassets.net/3mv54pzvptwz/5Lg1nWP6aoelT9lUAYJKru/1475acc016ecd56181ab10c8afce515d/8_lucasfigofoto_CBF_neymarjr_brasil_x_colombia_eliminatorias_111121.jpg"
        ];

        let indice = 0;
        const imgElement = document.getElementById("imagemExibida");

        function trocarImagem() {
            
            indice++;
            
            if (indice >= imagens.length) {
                indice = 0;
            }
            imgElement.src = imagens[indice];
        }

        // Funções para a navegação por botões
        function proximaImagemManual() {
            trocarImagem();
        }

        function imagemAnterior() {
            indice--;
            
            if (indice < 0) {
                indice = imagens.length - 1;
            }

            imgElement.src = imagens[indice];
        }

       
        setInterval(trocarImagem, 5000);
    </script>

</body>
</html>
